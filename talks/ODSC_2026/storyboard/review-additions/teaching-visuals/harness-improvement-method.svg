<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FAF2DB"/><text x="100" y="130" font-family="Arial, sans-serif" font-size="56" fill="#202523" font-weight="700">A harness change needs a repeatable comparison</text><text x="102" y="185" font-family="Arial, sans-serif" font-size="27" fill="#626764" font-weight="400">Use Agent Canvas to locate the failure, then check the effect of one change.</text><line x1="100" y1="225" x2="1820" y2="225" stroke="#CAC7BC" stroke-width="2"/><text x="100" y="350" font-family="Arial, sans-serif" font-size="48" fill="#147F7B" font-weight="700">01</text><line x1="100" y1="382" x2="440" y2="382" stroke="#147F7B" stroke-width="4"/><text x="100" y="445" font-family="Arial, sans-serif" font-size="34" fill="#202523" font-weight="700">Inspect the trace</text><text x="100" y="510" font-family="Arial, sans-serif" font-size="30" fill="#202523" font-weight="400">Find the wasted work</text><text x="100" y="555" font-family="Arial, sans-serif" font-size="30" fill="#202523" font-weight="400">or missing evidence.</text><line x1="450" y1="460" x2="514" y2="460" stroke="#147F7B" stroke-width="5"/><line x1="498" y1="448" x2="514" y2="460" stroke="#147F7B" stroke-width="5"/><line x1="498" y1="472" x2="514" y2="460" stroke="#147F7B" stroke-width="5"/><text x="550" y="350" font-family="Arial, sans-serif" font-size="48" fill="#147F7B" font-weight="700">02</text><line x1="550" y1="382" x2="890" y2="382" stroke="#147F7B" stroke-width="4"/><text x="550" y="445" font-family="Arial, sans-serif" font-size="34" fill="#202523" font-weight="700">Change one setting</text><text x="550" y="510" font-family="Arial, sans-serif" font-size="30" fill="#202523" font-weight="400">Write down what you</text><text x="550" y="555" font-family="Arial, sans-serif" font-size="30" fill="#202523" font-weight="400">expect it to change.</text><line x1="900" y1="460" x2="964" y2="460" stroke="#147F7B" stroke-width="5"/><line x1="948" y1="448" x2="964" y2="460" stroke="#147F7B" stroke-width="5"/><line x1="948" y1="472" x2="964" y2="460" stroke="#147F7B" stroke-width="5"/><text x="1000" y="350" font-family="Arial, sans-serif" font-size="48" fill="#147F7B" font-weight="700">03</text><line x1="1000" y1="382" x2="1340" y2="382" stroke="#147F7B" stroke-width="4"/><text x="1000" y="445" font-family="Arial, sans-serif" font-size="34" fill="#202523" font-weight="700">Rerun and verify</text><text x="1000" y="510" font-family="Arial, sans-serif" font-size="30" fill="#202523" font-weight="400">Repeat the same task</text><text x="1000" y="555" font-family="Arial, sans-serif" font-size="30" fill="#202523" font-weight="400">and check the result.</text><line x1="1350" y1="460" x2="1414" y2="460" stroke="#147F7B" stroke-width="5"/><line x1="1398" y1="448" x2="1414" y2="460" stroke="#147F7B" stroke-width="5"/><line x1="1398" y1="472" x2="1414" y2="460" stroke="#147F7B" stroke-width="5"/><text x="1450" y="350" font-family="Arial, sans-serif" font-size="48" fill="#147F7B" font-weight="700">04</text><line x1="1450" y1="382" x2="1790" y2="382" stroke="#147F7B" stroke-width="4"/><text x="1450" y="445" font-family="Arial, sans-serif" font-size="34" fill="#202523" font-weight="700">Check transfer</text><text x="1450" y="510" font-family="Arial, sans-serif" font-size="30" fill="#202523" font-weight="400">Try another task before</text><text x="1450" y="555" font-family="Arial, sans-serif" font-size="30" fill="#202523" font-weight="400">keeping the change.</text><text x="100" y="745" font-family="Arial, sans-serif" font-size="25" fill="#147F7B" font-weight="700">HOLD FIXED</text><text x="370" y="745" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Task, model, starting files, environment, verifier</text><text x="100" y="830" font-family="Arial, sans-serif" font-size="25" fill="#147F7B" font-weight="700">MEASURE</text><text x="370" y="830" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Verified outcome, total cost, time, retries, human intervention</text><text x="100" y="1007" font-family="Arial, sans-serif" font-size="27" fill="#626764" font-weight="400">Use repeated trials to distinguish the intended effect from a different model trajectory.</text></svg>