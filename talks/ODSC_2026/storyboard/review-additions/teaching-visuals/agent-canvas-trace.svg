<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#FAF2DB"/><text x="100" y="130" font-family="Arial, sans-serif" font-size="56" fill="#202523" font-weight="700">The model chooses actions inside a harness</text><text x="102" y="185" font-family="Arial, sans-serif" font-size="27" fill="#626764" font-weight="400">Selected events from a real Agent Canvas run · Incident Operations Center · GLM-5.2</text><line x1="100" y1="225" x2="1820" y2="225" stroke="#CAC7BC" stroke-width="2"/><text x="112" y="305" font-family="Arial, sans-serif" font-size="25" fill="#C67535" font-weight="700">HARNESS</text><text x="405" y="305" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Supplies system instructions and available tools</text><text x="1700" y="305" font-family="Arial, sans-serif" font-size="24" fill="#626764" font-weight="400">00000</text><line x1="100" y1="332" x2="1820" y2="332" stroke="#CAC7BC" stroke-width="2"/><text x="112" y="392" font-family="Arial, sans-serif" font-size="25" fill="#626764" font-weight="700">USER</text><text x="405" y="392" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Requests a durable incident-operations system</text><text x="1700" y="392" font-family="Arial, sans-serif" font-size="24" fill="#626764" font-weight="400">00001</text><line x1="100" y1="419" x2="1820" y2="419" stroke="#CAC7BC" stroke-width="2"/><text x="112" y="479" font-family="Arial, sans-serif" font-size="25" fill="#147F7B" font-weight="700">MODEL</text><text x="405" y="479" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Requests a terminal call: list repository files</text><text x="1700" y="479" font-family="Arial, sans-serif" font-size="24" fill="#626764" font-weight="400">00004</text><line x1="100" y1="506" x2="1820" y2="506" stroke="#CAC7BC" stroke-width="2"/><text x="112" y="566" font-family="Arial, sans-serif" font-size="25" fill="#C67535" font-weight="700">HARNESS / TOOL</text><text x="405" y="566" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Executes the command and returns file names</text><text x="1700" y="566" font-family="Arial, sans-serif" font-size="24" fill="#626764" font-weight="400">00005</text><line x1="100" y1="593" x2="1820" y2="593" stroke="#CAC7BC" stroke-width="2"/><text x="112" y="653" font-family="Arial, sans-serif" font-size="25" fill="#147F7B" font-weight="700">MODEL</text><text x="405" y="653" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Requests a full test run</text><text x="1700" y="653" font-family="Arial, sans-serif" font-size="24" fill="#626764" font-weight="400">00121</text><line x1="100" y1="680" x2="1820" y2="680" stroke="#CAC7BC" stroke-width="2"/><text x="112" y="740" font-family="Arial, sans-serif" font-size="25" fill="#C67535" font-weight="700">HARNESS / TOOL</text><text x="405" y="740" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Returns the test result: 41 passed in 11.14s</text><text x="1700" y="740" font-family="Arial, sans-serif" font-size="24" fill="#626764" font-weight="400">00122</text><line x1="100" y1="767" x2="1820" y2="767" stroke="#CAC7BC" stroke-width="2"/><text x="112" y="827" font-family="Arial, sans-serif" font-size="25" fill="#147F7B" font-weight="700">MODEL</text><text x="405" y="827" font-family="Arial, sans-serif" font-size="33" fill="#202523" font-weight="400">Proposes completion through the finish tool</text><text x="1700" y="827" font-family="Arial, sans-serif" font-size="24" fill="#626764" font-weight="400">00286</text><line x1="100" y1="854" x2="1820" y2="854" stroke="#CAC7BC" stroke-width="2"/><text x="100" y="1007" font-family="Arial, sans-serif" font-size="27" fill="#626764" font-weight="400">Editing and intermediate events omitted. Passing tests establish only the behavior those tests cover.</text></s