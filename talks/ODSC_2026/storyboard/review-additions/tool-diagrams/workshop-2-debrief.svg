  <g fill="#20201E" font-size="34"><text x="40" y="210">The trace repeats</text><text x="40" y="305">The output can be bounded</text><text x="40" y="400">A verifier can check it</text><text x="880" y="210">The next question is unknown</text><text x="880" y="305">Exploration matters</text><text x="880" y="400">Exceptions are common</text></g>
  <text x="40" y="620" fill="#676358" font-size="27">Start with primitives. Bundle the path only after the repeated work is visible.</text>
