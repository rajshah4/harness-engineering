16"><path d="M1093.3333333333333,140 L1560,140" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-17"><text x="1093.3333333333333" y="213" font-size="36" fill="#20201E" font-weight="700">Harness + tool</text></g><g id="part-18"><text x="1093.3333333333333" y="325" font-size="32" fill="#20201E" font-weight="400">Executes it and returns</text></g><g id="part-19"><text x="1093.3333333333333" y="366.6" font-size="32" fill="#20201E" font-weight="400">evidence</text></g><g id="part-20"><text x="40" y="590" font-size="27" fill="#676358" font-weight="400">The returned observation becomes context for the next model call. Illustrative loop, not a new trace.</text></g></svg>