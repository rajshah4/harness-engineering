<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="680" viewBox="0 0 1660 680" font-family="Arial, sans-serif"><g id="part-0"><text x="40" y="110" font-size="40" fill="#2E70FF" font-weight="700">01</text></g><g id="part-1"><path d="M40,140 L375,140" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-2"><text x="40" y="213" font-size="36" fill="#20201E" font-weight="700">Attempt</text></g><g id="part-3"><text x="40" y="325" font-size="32" fill="#20201E" font-weight="400">Work within the</text></g><g id="part-4"><text x="40" y="366.6" font-size="32" fill="#20201E" font-weight="400">budget</text></g><g id="part-5"><path d="M385,237 L415,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-6"><path d="M405,229 L415,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-7"><path d="M405,245 L415,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-8"><text x="435" y="110" font-size="40" fill="#2E70FF" font-weight="700">02</text></g><g id="part-9"><path d="M435,140 L770,140" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-10"><text x="435" y="213" font-size="36" fill="#20201E" font-weight="700">External check</text></g><g id="part-11"><text x="435" y="325" font-size="32" fill="#20201E" font-weight="400">Compare with</text></g><g id="part-12"><text x="435" y="366.6" font-size="32" fill="#20201E" font-weight="400">requirements</text></g><g id="part-13"><path d="M780,237 L810,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-14"><path d="M800,229 L810,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-15"><path d="M800,245 L810,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-16"><text x="830" y="110" font-size="40" fill="#2E70FF" font-weight="700">03</text></g><g id="part-17"><path d="M830,140 L1165,140" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-18"><text x="830" y="213" font-size="36" fill="#20201E" font-weight="700">Decision</text></g><g id="part-19"><text x="830" y="325" font-size="32" fill="#20201E" font-weight="400">Continue, escalate</text></g><g id="part-20"><text x="830" y="366.6" font-size="32" fill="#20201E" font-weight="400">or stop</text></g><g id="part-21"><path d="M1175,237 L1205,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-22"><path d="M1195,229 L1205,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-23"><path d="M1195,245 L1205,237" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-24"><text x="1225" y="110" font-size="40" fill="#2E70FF" font-weight="700">04</text></g><g id="part-25"><path d="M1225,140 L1560,140" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-26"><text x="1225" y="213" font-size="36" fill="#20201E" font-weight="700">Checkpoint</text></g><g id="part-27"><text x="1225" y="325" font-size="32" fill="#20201E" font-weight="400">Failure evidence</text></g><g id="part-28"><text x="1225" y="366.6" font-size="32" fill="#20201E" font-weight="400">and next step</text></g><g id="part-29"><text x="40" y="590" font-size="27" fill="#676358" font-weight="400">Continue only with a reason and remaining budget. An exhausted budget is not success.</text></g></svg>