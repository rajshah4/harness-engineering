<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="680" viewBox="0 0 1660 680" font-family="Arial, sans-serif"><g id="part-0"><text x="40" y="90" font-size="38" fill="#20201E" font-weight="700">Interface to the capability</text></g><g id="part-1"><path d="M40,125 L780,125" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-2"><text x="40" y="210" font-size="34" fill="#20201E" font-weight="400">API: request and response</text></g><g id="part-3"><text x="40" y="305" font-size="34" fill="#20201E" font-weight="400">MCP: exposed tools and resources</text></g><g id="part-4"><text x="40" y="400" font-size="34" fill="#20201E" font-weight="400">CLI: commands and output</text></g><g id="part-5"><text x="880" y="90" font-size="38" fill="#20201E" font-weight="700">Harness design choices</text></g><g id="part-6"><path d="M880,125 L1620,125" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-7"><text x="880" y="210" font-size="34" fill="#20201E" font-weight="400">What the model sees</text></g><g id="part-8"><text x="880" y="305" font-size="34" fill="#20201E" font-weight="400">How much work a call performs</text></g><g id="part-9"><text x="880" y="400" font-size="34" fill="#20201E" font-weight="400">How results enter context</text></g><g id="part-10"><text x="40" y="590" font-size="27" fill="#676358" font-weight="400">These are overlapping layers. A CLI or MCP tool can call the same underlying API.</text></g></svg>