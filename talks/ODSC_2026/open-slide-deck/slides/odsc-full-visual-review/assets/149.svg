<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="680" viewBox="0 0 1660 680" font-family="Arial, sans-serif"><g id="part-0"><text x="40" y="60" font-size="28" fill="#676358" font-weight="700">Interface principle</text></g><g id="part-1"><text x="650" y="60" font-size="28" fill="#676358" font-weight="700">What to inspect</text></g><g id="part-2"><path d="M40,90 L1620,90" stroke="#CCC6B6" stroke-width="3" fill="none"/></g><g id="part-3"><text x="40" y="150" font-size="32" fill="#20201E" font-weight="400">Simple actions</text></g><g id="part-4"><text x="650" y="150" font-size="38" fill="#2E70FF" font-weight="700">Can the model choose the right operation?</text></g><g id="part-5"><path d="M40,183 L1620,183" stroke="#CCC6B6" stroke-width="3" fill="none"/></g><g id="part-6"><text x="40" y="275" font-size="32" fill="#20201E" font-weight="400">Compact actions</text></g><g id="part-7"><text x="650" y="275" font-size="38" fill="#2E70FF" font-weight="700">How much recurring work does one call handle?</text></g><g id="part-8"><path d="M40,308 L1620,308" stroke="#CCC6B6" stroke-width="3" fill="none"/></g><g id="part-9"><text x="40" y="400" font-size="32" fill="#20201E" font-weight="400">Informative feedback</text></g><g id="part-10"><text x="650" y="400" font-size="38" fill="#2E70FF" font-weight="700">Does the result support the next decision?</text></g><g id="part-11"><path d="M40,433 L1620,433" stroke="#CCC6B6" stroke-width="3" fill="none"/></g><g id="part-12"><text x="40" y="525" font-size="32" fill="#20201E" font-weight="400">Guardrails</text></g><g id="part-13"><text x="650" y="525" font-size="38" fill="#2E70FF" font-weight="700">Which failures can the harness contain?</text></g><g id="part-14"><path d="M40,558 L1620,558" stroke="#CCC6B6" stroke-width="3" fill="none"/></g><g id="part-15"><text x="40" y="590" font-size="27" fill="#676358" font-weight="400">Check the action interface, feedback and error handling separately.</text></g></svg>
