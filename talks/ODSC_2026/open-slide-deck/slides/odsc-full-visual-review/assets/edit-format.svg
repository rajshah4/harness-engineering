<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="680" viewBox="0 0 1660 680" font-family="Arial, sans-serif"><g id="part-0"><text x="40" y="90" font-size="38" fill="#20201E" font-weight="700">Edit representations</text></g><g id="part-1"><path d="M40,125 L780,125" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-2"><text x="40" y="210" font-size="34" fill="#20201E" font-weight="400">Whole-file rewrite</text></g><g id="part-3"><text x="40" y="305" font-size="34" fill="#20201E" font-weight="400">Search and replace</text></g><g id="part-4"><text x="40" y="400" font-size="34" fill="#20201E" font-weight="400">Structured patch</text></g><g id="part-5"><text x="880" y="90" font-size="38" fill="#20201E" font-weight="700">Failure to inspect</text></g><g id="part-6"><path d="M880,125 L1620,125" stroke="#2E70FF" stroke-width="3" fill="none"/></g><g id="part-7"><text x="880" y="210" font-size="34" fill="#20201E" font-weight="400">Unintended unrelated changes</text></g><g id="part-8"><text x="880" y="305" font-size="34" fill="#20201E" font-weight="400">Missing or ambiguous match</text></g><g id="part-9"><text x="880" y="400" font-size="34" fill="#20201E" font-weight="400">Patch no longer applies</text></g><g id="part-10"><text x="40" y="590" font-size="27" fill="#676358" font-weight="400">Illustrative failure modes. A controlled same-model benchmark remains a source follow-up.</text></g></svg>